curriculum:
  mode: mixed
  total_timesteps: 2048
  workload_mix:
    convoy: 0.2
    pareto: 0.6
    poisson: 0.2
environment:
  load_factor: 0.8
  num_envs: 4
  num_tasks: 30
  top_k: 16
experiment:
  device: cpu
  export_dir: ml/checkpoints
  name: ppo_quick
  num_training_seeds: 1
  seed: 42
network:
  actor_hidden_dims:
  - 64
  - 32
  architecture: teacher
  critic_hidden_dims:
  - 32
  - 32
ppo:
  batch_size: 64
  clip_epsilon: 0.2
  entropy_coef_end: 0.001
  entropy_coef_start: 0.02
  gae_lambda: 0.95
  gamma: 0.99
  learning_rate: 0.0005
  max_grad_norm: 0.5
  num_epochs: 4
  num_rollout_steps: 64
  target_kl: 0.03
  value_coef: 0.5
reward:
  completion_bonus: 2.0
  context_switch_penalty_weight: 0.05
  max_wait_penalty_weight: 0.1
  step_wait_penalty_weight: 1.0
  tail_penalty_weight: 0.5
